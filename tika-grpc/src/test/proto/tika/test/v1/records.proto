syntax = "proto3";

// A small WARC record lister, only for tika-grpc's external parser adapter tests. It is not
// part of Tika's API: it stands for any parser whose stubs an adapter jar carries.
package tika.test.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "org.apache.tika.pipes.grpc.compose.records";

service RecordListService {
  rpc ListRecords(ListRecordsRequest) returns (ListRecordsResponse);
}

message ListRecordsRequest {
  bytes archive = 1;
  // From the adapter's "strict" option.
  bool strict = 2;
}

message ListRecordsResponse {
  repeated Record records = 1;
  repeated RecordError errors = 2;
}

message Record {
  int64 stream_pos = 1;
  repeated Header warc_headers = 2;
  google.protobuf.Timestamp date = 3;
  // Set for HTTP response records only.
  string http_status_line = 4;
  repeated Header http_headers = 5;
}

message Header {
  string name = 1;
  string value = 2;
}

message RecordError {
  int64 stream_pos = 1;
  string message = 2;
  bool recoverable = 3;
}
