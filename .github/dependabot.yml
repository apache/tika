version: 2
updates:
    # Enable version updates for Maven
    - package-ecosystem: "maven"
      # Look for `pom.xml` in the `root` directory
      directory: "/"
      # Check for updates weekly
      schedule:
          interval: "weekly"
      # Allow up to 20 open pull requests
      open-pull-requests-limit: 20

    # Actions pinned by SHA with a "# vX.Y.Z" comment get bumped too. The ASF
    # allow-list expires a superseded version three months after approving the
    # next one; asf-allowlist-check.yml fails a bump that is not yet approved.
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"

    - package-ecosystem: "docker"
      directories:
          - "/.devcontainer"
          - "/tika-grpc/docker-build"
          - "/tika-server/docker-build/full"
          - "/tika-server/docker-build/minimal"
      schedule:
          interval: "weekly"
      # the devcontainer stays on the Java baseline (17); digest refreshes still flow
      ignore:
          - dependency-name: "eclipse-temurin"
            update-types: ["version-update:semver-major"]
