name: buf lint and breaking

on:
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.proto'
      - '**/buf.yaml'
      - '.github/workflows/buf.yml'
  push:
    branches: [ main ]
    paths:
      - '**/*.proto'
      - '**/buf.yaml'
      - '.github/workflows/buf.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUF_VERSION: 1.50.0

jobs:
  buf:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # tika-grpc holds the frozen v1 tika.proto, tika-grpc-api the v2 contract.
        module: [ tika-grpc, tika-grpc-api ]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: buf lint
        working-directory: ${{ matrix.module }}
        run: npx --yes "@bufbuild/buf@${BUF_VERSION}" lint
      - name: buf breaking against the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          MODULE: ${{ matrix.module }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          if [ -z "$(git ls-tree -r --name-only FETCH_HEAD -- "$MODULE/src/main/proto" | grep '\.proto$')" ]; then
            echo "$BASE_REF has no protos under $MODULE yet; nothing to compare."
            exit 0
          fi
          npx --yes "@bufbuild/buf@${BUF_VERSION}" breaking "$MODULE" \
            --against ".git#ref=$(git rev-parse FETCH_HEAD),subdir=$MODULE/src/main/proto"
