# The one Windows job. Two things it uniquely covers:
#   - path handling: the checkout dir below deliberately contains a space
#   - an alternate (non-en_US) locale
#
# Locale is set with JAVA_TOOL_OPTIONS, which every JVM (surefire forks included)
# reads at startup. NOT LANG/LC_ALL: the Windows JVM reads the OS locale via Win32
# and ignores them. NOT -Duser.language on the mvn command line: surefire sets that
# in the fork only after the default Locale is fixed, so the tests ran in en_US.
# DefaultLocaleCanaryTest fails the build if the locale does not reach the fork.
#
# push-only, like the jdk21/jdk25 and tr_TR builds. This is the most expensive
# job in CI -- a full reactor on a 2x-cost runner, ~48 min -- and it gated PR
# wall clock all by itself while every Linux job finished in ~22. Windows-only
# regressions are real but rare, so they are caught on main within the hour
# rather than paid for on every PR push.
name: main jdk17 windows build (de_DE)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      # The space in this path is deliberate -- it is what catches path-quoting bugs.
      - uses: actions/checkout@v6
        with:
          path: 'tika build dir'
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - name: Cache Maven repository
        # Explicit, not setup-java's cache: 'maven', so our own snapshots stay out of the tarball.
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/org/apache/tika
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Build with Maven (de_DE locale)
        working-directory: 'tika build dir'
        env:
          JAVA_TOOL_OPTIONS: -Duser.language=de -Duser.country=DE
          TIKA_EXPECTED_LOCALE: de-DE
        # No -T1C here (TIKA-4867): this is the heaviest job (locale + e2e + javadoc)
        # on a 4-core runner; parallel modules starved the tika-server integration
        # tests into startup timeouts. Serial reactor also needs no annotation-
        # processor pre-install.
        run: mvn clean test install javadoc:aggregate -Pci -Pe2e -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
