# Every locale the random-locale listener prioritizes, each in its own full-reactor
# build, plus one random draw for the long tail. Nothing gates on this job: it is
# the canary for locale-dependent code (TIKA-4920). The rule for turning
# -Dtika.test.locale=random back on in the PR jobs is several green nights here
# in a row. Reproduce a failure locally with the same -Dtika.test.locale=<tag>.
#
# Only in-process tests see the locale: pipes forks receive their parent's locale
# as -D flags, but JVMs the tests start themselves (tika-server) inherit only the
# environment. main-jdk17-windows-build covers that surface under de_DE.
name: nightly locale build

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'apache/tika'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        locale:
          - tr-TR
          - az-Latn-AZ
          - th-TH-u-nu-thai-x-lvariant-TH
          - ja-JP-u-ca-japanese-x-lvariant-JP
          - ar-EG
          - de-DE
          - random

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Cache Maven repository
        # Explicit, not setup-java's cache: 'maven', so our own snapshots stay out of the tarball.
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/org/apache/tika
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Build with Maven under ${{ matrix.locale }}
        run: mvn install -Pfast -pl :tika-annotation-processor -am -B -q && mvn clean test install -Pci -T1C -Dtika.test.locale=${{ matrix.locale }} -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
