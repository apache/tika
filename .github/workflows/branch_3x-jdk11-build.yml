name: branch_3x jdk11 tests

on:
  pull_request:
    branches: [ branch_3x ]
  push:
    branches: [ branch_3x ]

# Builds on JDK 17 and runs each module's tests on the JDK it targets: 11 for tika-core, tika-app,
# the parsers and tika-server-client, 17 for tika-server (TIKA-5069).
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 11 and 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          # the last one listed is the build JDK; both are written to toolchains.xml
          java-version: |
            11
            17
      - name: Build with Maven
        run: mvn clean install -Pci,test-on-target-jdk
