// The Document: one message for a parsed Tika document, whatever the source format.
//
// Metadata: typed fields for the common Dublin Core properties, plus `extra` for every
// other key. A value in `extra` is typed when Tika declares a type for its key, and a
// string otherwise. The extracted text and embedded documents are not included.
//
// Format-specific mapping lives in DocumentTransformer code in tika-grpc-mapper, so
// supporting a new parser does not change this file.

syntax = "proto3";

package org.apache.tika.grpc.v2;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "org.apache.tika.grpc.v2";

message Document {
  // envelope
  // The caller's key for the request: fetch_key on FetchAndParse, correlation_id
  // on ParseBytes, returned unchanged. To identify the parsed bytes, use
  // origin.sha256, which is set when a digester is configured (always on ParseBytes).
  string id = 1;
  // Tika-detected MIME type. When a ParseBytes parse failed before detecting one, the
  // server fills it from the bytes and resource name: magic bytes, plus a look inside
  // gzip (a gzipped WARC is application/warc+gz), but no container detection.
  string content_type = 2;
  google.protobuf.Timestamp parsed_at = 4;
  ParseStatus status = 5;
  SourceOrigin origin = 6;

  // metadata
  DocumentMetadata metadata = 20;      // typed common fields
  repeated MetadataField extra = 21;   // tagged tail: everything not already typed

  // Results that external parsers attached to this document (TIKA-4771). Tika's own
  // parse never sets them: a composer appends them after calling Tika and the external
  // parsers with the same bytes. tika-grpc's ParseBytes is such a composer when
  // grpc.externalParsers is configured. One entry per contribution slot, with its
  // status, warnings and timing.
  repeated ExtensionResult extensions = 40;

  // Documents inside this one, such as a WARC's records. External parser adapters add
  // them, each entry naming its producer_id; Tika's own embedded documents are not
  // included yet.
  repeated EmbeddedDocument embedded = 41;

  // Field numbers 3, 10-19, 30-39 and 42+ are left unassigned for later fields.
}

// One document inside another: a WARC record, an archive entry, an attachment. Not a
// Document: it has no id of its own and no documents inside it.
//
// Document.embedded lists each producer's documents together, in the order the producer
// made them: Tika's own first (when they are added), then each external parser's, in
// the order of grpc.externalParsers. (producer_id, path) is unique within a Document;
// the same record from Tika and from an adapter appears once under each producer.
message EmbeddedDocument {
  // Where the document sits in its container, in the form of Tika's
  // X-TIKA:embedded_resource_path, e.g. /record-12. Set by the producer.
  string path = 1;
  // "tika" for Tika's own parse, otherwise the producer_id of the adapter that made it.
  string producer_id = 2;
  string content_type = 3;
  SourceOrigin origin = 4;
  DocumentMetadata metadata = 5;
  repeated MetadataField extra = 6;
  // STATUS_SUCCESS, or STATUS_PARTIAL when the producer reported errors for this
  // document, listed in errors.
  ParseStatus.Status status = 7;
  repeated string errors = 8;
}

// One external parser's contribution to a Document (TIKA-4771). Tika never models
// the payload: its schema belongs to the producer, and a consumer unpacks only the
// types it understands.
message ExtensionResult {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_OK = 1;
    STATUS_EMPTY = 2;
    STATUS_FAILED = 3;
    STATUS_SKIPPED = 4;
    // The producer stopped part way: what it produced before is in the Document, and
    // warnings say why it stopped.
    STATUS_PARTIAL = 5;
  }
  // Names the composer's contribution slot, not a service instance: the same service
  // called twice is two slots.
  string producer_id = 1;
  Status status = 2;
  // The producer's own message, when the composer keeps it. Several results (one per
  // page, say) belong inside it, not in several envelopes. tika-grpc's adapters map
  // the reply into embedded documents and prefixed extra keys, and set this only when
  // the adapter's config has keepRawReply.
  google.protobuf.Any payload = 3;
  repeated string warnings = 4;
  int64 elapsed_ms = 5;
  // How many embedded documents the producer reported, and how many of them the
  // Document carries. They differ when a limit cut the list short, and then truncated
  // is set: a consumer must not take the embedded list as the whole archive.
  int64 embedded_reported = 6;
  int64 embedded_kept = 7;
  bool truncated = 8;
}

message SourceOrigin {
  string filename = 1;
  // Unset when the size is not known; 0 is an empty source.
  optional int64 byte_size = 2;
  string parser = 3;
  // Hex-encoded SHA-256 of the source bytes, taken from the digest the parse pipeline
  // recorded (the tk:digest:SHA-256 metadata value). FetchAndParse leaves it empty when
  // the pipeline has no digester configured or the parse failed before digesting.
  // ParseBytes holds the bytes, so it computes the digest itself in those cases and
  // this is always set. Downstream consumers use it to tie derived artifacts
  // (annotations, index entries) back to the exact bytes that were parsed.
  string sha256 = 4;
  // Set only by ParseBytes, from the request; empty for FetchAndParse. The URIs the
  // caller recorded for the bytes, which Tika does not use, and whether the caller
  // cut the bytes short.
  string source_uri = 5;
  string effective_uri = 6;
  string base_uri = 7;
  bool truncated = 8;
}

// =========================================================================
// Metadata: typed common fields from the Dublin Core element set (title, creator,
// description, subject, language, publisher, identifier, date, rights), the same
// vocabulary Tika's property model and XMP use. Narrower keys (page counts,
// dimensions, format-specific keys) go to `extra` with their declared type.
// A single-valued field (title, description, created, modified, rights) holds the
// first value; when the document declares several, `extra` also carries the key
// with all of them, so none is lost.
// =========================================================================
message DocumentMetadata {
  string title = 1;
  repeated string authors = 2;
  string description = 3;
  repeated string keywords = 4;
  repeated string languages = 5;
  repeated string publishers = 6;
  // Unambiguous references to the resource as declared by the document itself
  // (DOI, ISBN, ...), from dc:identifier.
  repeated string identifiers = 7;

  google.protobuf.Timestamp created = 10;
  google.protobuf.Timestamp modified = 11;

  string rights = 20;         // free-text rights/license statement, from dc:rights
}

// =========================================================================
// A metadata key with its values. Tika stores every metadata value as an array of
// strings under one key: a single value is a one-element array, and declared
// sequences such as pdf:charsPerPage or tiff:BitsPerSample have one element per page
// or sample. The oneof gives the element type of the whole array, so integers stay
// int64 and dates stay Timestamps however many there are. Consumers of a single value
// read values[0].
// =========================================================================
message MetadataField { string key = 1; MetadataValue value = 2; }
message MetadataValue {
  oneof values {
    StringValues strings = 1;           // keys without a declared type
    IntegerValues integers = 2;
    NumberValues numbers = 3;
    BooleanValues booleans = 4;
    TimestampValues timestamps = 5;
  }
}
message StringValues { repeated string values = 1; }
message IntegerValues { repeated int64 values = 1; }
message NumberValues { repeated double values = 1; }
message BooleanValues { repeated bool values = 1; }
message TimestampValues { repeated google.protobuf.Timestamp values = 1; }

message ParseStatus {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_SUCCESS = 1;
    STATUS_PARTIAL = 2;
    STATUS_FAILED = 3;
  }
  Status status = 1;
  // Milliseconds for the whole fetch and parse, measured by the server. Both happen
  // in the forked pipes worker, so the parse time alone is not available.
  int64 fetch_parse_time_ms = 2;
  repeated string parsers_used = 3;
  repeated string errors = 4;
  // Version string of the Tika that produced this document (e.g. "Apache Tika 4.0.0"),
  // so long-lived stores can tell which producer wrote an entry.
  string tika_version = 5;
  // The raw pipes result `status` was derived from (e.g. "PARSE_SUCCESS", "TIMEOUT";
  // see org.apache.tika.pipes.api.PipesResult.RESULT_STATUS). Its values can change
  // between Tika versions: branch on `status` and use this for logs.
  string pipes_status = 6;
}
