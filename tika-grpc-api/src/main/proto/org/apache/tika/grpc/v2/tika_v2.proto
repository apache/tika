// Experimental v2 parse surface. Fetcher/iterator management stays on the
// existing `tika.Tika` (v1) service; this service returns the typed Document
// contract instead of the v1 fields map.

syntax = "proto3";

package org.apache.tika.grpc.v2;

import "org/apache/tika/grpc/v2/document.proto";

option java_multiple_files = true;
option java_package = "org.apache.tika.grpc.v2";
option java_outer_classname = "TikaV2Proto";

service TikaV2Service {
  // Fetch via a previously saved fetcher and return a typed Document.
  rpc FetchAndParse(FetchAndParseRequest) returns (FetchAndParseResponse) {}
  // FetchAndParse as a server stream: one response, then the stream completes.
  rpc FetchAndParseServerSideStreaming(FetchAndParseServerSideStreamingRequest)
      returns (stream FetchAndParseServerSideStreamingResponse) {}
  // One response for each request on the stream.
  rpc FetchAndParseBiDirectionalStreaming(stream FetchAndParseBiDirectionalStreamingRequest)
      returns (stream FetchAndParseBiDirectionalStreamingResponse) {}

  // Parses the bytes sent in the request, without a fetcher, and returns the same
  // Document as FetchAndParse.
  rpc ParseBytes(ParseBytesRequest) returns (ParseBytesResponse) {}
}

// Each RPC has its own request and response message so it can change on its own. Today
// the three requests carry the same fields under the same numbers, and so do the three
// responses.

message FetchAndParseRequest {
  // ID of a fetcher previously saved through the v1 Tika service.
  string fetcher_id = 1;
  string fetch_key = 2;
  string additional_fetch_config_json = 3;
  // v2 returns the Document and never sends it to an emitter.
  reserved 4;
  reserved "emitter_id";
  // Optional JSON object to configure the ParseContext for this request.
  string parse_context_json = 5;
}

message FetchAndParseResponse {
  string fetch_key = 1;
  Document document = 2;
}

message FetchAndParseServerSideStreamingRequest {
  // ID of a fetcher previously saved through the v1 Tika service.
  string fetcher_id = 1;
  string fetch_key = 2;
  string additional_fetch_config_json = 3;
  // v2 returns the Document and never sends it to an emitter.
  reserved 4;
  reserved "emitter_id";
  // Optional JSON object to configure the ParseContext for this request.
  string parse_context_json = 5;
}

message FetchAndParseServerSideStreamingResponse {
  string fetch_key = 1;
  Document document = 2;
}

message FetchAndParseBiDirectionalStreamingRequest {
  // ID of a fetcher previously saved through the v1 Tika service.
  string fetcher_id = 1;
  string fetch_key = 2;
  string additional_fetch_config_json = 3;
  // v2 returns the Document and never sends it to an emitter.
  reserved 4;
  reserved "emitter_id";
  // Optional JSON object to configure the ParseContext for this request.
  string parse_context_json = 5;
}

message FetchAndParseBiDirectionalStreamingResponse {
  string fetch_key = 1;
  Document document = 2;
}

message ParseBytesRequest {
  // The caller's id for this request, returned unchanged as Document.id and
  // ParseBytesResponse.correlation_id.
  string correlation_id = 1;
  // Bytes to parse. Required, at most the server's parseBytesMaxContentBytes. The
  // whole request must also fit the server's gRPC inbound limit: by default
  // parseBytesMaxContentBytes plus 1 MiB (257 MiB), unless maxInboundMessageBytes
  // sets another value.
  bytes content = 2;
  // Optional file name, such as "page.html". Tika uses it to detect the content type
  // and returns it as Document.origin.filename.
  string resource_name = 3;
  // Optional URIs the caller records for the bytes, such as the requested URL, the
  // URL after redirects and the base URL for relative links. Tika returns them in
  // Document.origin and does not use them.
  string source_uri = 4;
  string effective_uri = 5;
  string base_uri = 6;
  // Set when the caller cut the bytes short, for example at a crawler's size limit.
  // Returned as Document.origin.truncated. A parse that would otherwise be
  // STATUS_SUCCESS is reported as STATUS_PARTIAL, because parsers can recover cut-off
  // bytes silently while losing metadata stored past the cut.
  bool truncated = 7;
  // Optional JSON object to configure the ParseContext for this request.
  string parse_context_json = 8;
}

message ParseBytesResponse {
  string correlation_id = 1;
  Document document = 2;
}
