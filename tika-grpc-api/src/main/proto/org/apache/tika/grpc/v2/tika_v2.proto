// Experimental v2 parse surface. Fetcher/iterator management stays on the
// existing `tika.Tika` (v1) service; this service returns the typed Document
// contract instead of the v1 fields map.

syntax = "proto3";

package org.apache.tika.grpc.v2;

import "org/apache/tika/grpc/v2/document.proto";

option java_multiple_files = true;
option java_package = "org.apache.tika.grpc.v2";
option java_outer_classname = "TikaV2Proto";

service TikaV2Service {
  // Fetch via a previously saved fetcher and return a typed Document.
  rpc FetchAndParse(FetchAndParseRequest) returns (FetchAndParseResponse) {}
  // FetchAndParse as a server stream: one response, then the stream completes.
  rpc FetchAndParseServerSideStreaming(FetchAndParseServerSideStreamingRequest)
      returns (stream FetchAndParseServerSideStreamingResponse) {}
  // One response for each request on the stream.
  rpc FetchAndParseBiDirectionalStreaming(stream FetchAndParseBiDirectionalStreamingRequest)
      returns (stream FetchAndParseBiDirectionalStreamingResponse) {}
}

// Each RPC has its own request and response message so it can change on its own. Today
// the three requests carry the same fields under the same numbers, and so do the three
// responses.

message FetchAndParseRequest {
  // ID of a fetcher previously saved through the v1 Tika service.
  string fetcher_id = 1;
  string fetch_key = 2;
  string additional_fetch_config_json = 3;
  // v2 returns the Document and never sends it to an emitter.
  reserved 4;
  reserved "emitter_id";
  // Optional JSON object to configure the ParseContext for this request.
  string parse_context_json = 5;
}

message FetchAndParseResponse {
  string fetch_key = 1;
  Document document = 2;
}

message FetchAndParseServerSideStreamingRequest {
  // ID of a fetcher previously saved through the v1 Tika service.
  string fetcher_id = 1;
  string fetch_key = 2;
  string additional_fetch_config_json = 3;
  // v2 returns the Document and never sends it to an emitter.
  reserved 4;
  reserved "emitter_id";
  // Optional JSON object to configure the ParseContext for this request.
  string parse_context_json = 5;
}

message FetchAndParseServerSideStreamingResponse {
  string fetch_key = 1;
  Document document = 2;
}

message FetchAndParseBiDirectionalStreamingRequest {
  // ID of a fetcher previously saved through the v1 Tika service.
  string fetcher_id = 1;
  string fetch_key = 2;
  string additional_fetch_config_json = 3;
  // v2 returns the Document and never sends it to an emitter.
  reserved 4;
  reserved "emitter_id";
  // Optional JSON object to configure the ParseContext for this request.
  string parse_context_json = 5;
}

message FetchAndParseBiDirectionalStreamingResponse {
  string fetch_key = 1;
  Document document = 2;
}
